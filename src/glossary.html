<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money glossary | SAFE</title>
    <meta name="description" content="Plain-language South African money terms with rand examples: TFSA, two-pot retirement, repo rate, transfer duty, ETFs, debt review and more. Search, save terms and test yourself.">
    <link rel="icon" href="SAFE.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/tw.js"></script>
    <link rel="stylesheet" href="assets/site.css">
</head>
<body>
    <main id="main">
        <section class="page-head">
            <div class="wrap grid grid-cols-1 lg:grid-cols-3 gap-6 items-end">
                <div class="lg:col-span-2">
                    <p class="eyebrow">Money glossary</p>
                    <h1 class="mt-2 text-3xl md:text-5xl font-bold">Money words, <span class="text-gold">made simple</span></h1>
                    <p class="mt-4 text-gray-300 max-w-2xl">Every term is explained in plain language with a South African rand example. Search it, save it, then test yourself.</p>
                </div>
                <div class="flex lg:justify-end gap-2">
                    <button id="quiz-open" class="btn-gold">🧠 Test yourself</button>
                </div>
            </div>
        </section>

        <section class="section !pt-6">
            <div class="wrap">
                <!-- Sticky search & filters -->
                <div class="sticky top-16 z-30 bg-black/95 backdrop-blur py-3 -mx-4 px-4 sm:mx-0 sm:px-0 border-b border-white/5">
                    <div class="flex flex-col md:flex-row gap-3">
                        <label class="relative flex-1">
                            <span class="sr-only">Search terms</span>
                            <input id="g-search" type="search" class="field !pl-9 !py-3" placeholder="Search, e.g. TFSA, bond, two-pot, ETF…" autocomplete="off">
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500" aria-hidden="true">⌕</span>
                        </label>
                        <div class="flex gap-2">
                            <select id="g-level" class="field !w-auto" aria-label="Level">
                                <option value="0">All levels</option><option value="1">🟢 Beginner</option><option value="2">🟡 Intermediate</option><option value="3">🔴 Advanced</option>
                            </select>
                            <button id="g-saved" class="chip !py-2" aria-pressed="false">★ Saved <span id="g-saved-count" class="opacity-70"></span></button>
                        </div>
                    </div>
                    <div class="mt-3 flex gap-2 scroll-x no-scrollbar" id="g-cats" role="group" aria-label="Category"></div>
                    <nav class="mt-2 flex gap-1 scroll-x no-scrollbar text-xs" id="g-az" aria-label="Jump to letter"></nav>
                </div>

                <p class="mt-5 text-sm text-gray-400" id="g-count" aria-live="polite"></p>
                <div id="g-list" class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                <div class="mt-6 text-center"><button id="g-more" class="btn-ghost hidden"></button></div>
                <div id="g-empty" class="hidden text-center py-16">
                    <p class="text-gray-300">No terms match "<span id="g-empty-q"></span>".</p>
                    <p class="text-sm text-gray-500 mt-2">Try a simpler word, or <a class="text-gold underline" href="faq.html#contact">ask us to add it</a>.</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Quiz modal -->
    <div id="quiz" class="fixed inset-0 z-[70] hidden items-center justify-center bg-black/80 p-4" role="dialog" aria-modal="true" aria-labelledby="quiz-title">
        <div class="card w-full max-w-lg p-6 sm:p-8 relative">
            <button id="quiz-close" class="absolute top-3 right-3 w-9 h-9 rounded-full hover:bg-white/10" aria-label="Close quiz">✕</button>
            <div class="flex items-center justify-between">
                <h2 id="quiz-title" class="text-xl font-bold">Which term is this?</h2>
                <span class="text-sm text-gray-400" id="quiz-progress"></span>
            </div>
            <p class="mt-4 text-gray-200 leading-relaxed min-h-[5rem]" id="quiz-def"></p>
            <div class="mt-5 grid gap-2" id="quiz-options"></div>
            <div class="mt-5 flex items-center justify-between">
                <span class="text-sm" id="quiz-score"></span>
                <button id="quiz-next" class="btn-gold hidden">Next →</button>
            </div>
        </div>
    </div>

    <script src="assets/site.js"></script>
    <script src="data/glossary.js"></script>
    <script>
    (function () {
        const { esc, slug, store, toast } = window.SAFE;
        const TERMS = window.SAFE_GLOSSARY.map((t) => ({ ...t, id: slug(t.term) })).sort((a, b) => a.term.localeCompare(b.term));
        const byName = new Map(TERMS.map((t) => [t.term.toLowerCase(), t]));
        const CATS = ['All', ...new Set(window.SAFE_GLOSSARY.map((t) => t.cat))];
        const LEVEL = { 1: ['Beginner', 'level-1'], 2: ['Intermediate', 'level-2'], 3: ['Advanced', 'level-3'] };
        const state = { q: '', cat: 'All', level: 0, saved: false, open: new Set(), limit: 24 };
        let saved = new Set(store.get('glossary-saved', []));

        const $ = (id) => document.getElementById(id);
        $('g-cats').innerHTML = CATS.map((c) => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${c === 'All'}">${esc(c)}</button>`).join('');

        // Search: every word must match the term, an alias or the definition. Exact/term matches rank first.
        function score(t, words) {
            if (!words.length) return 1;
            const name = t.term.toLowerCase(), alias = t.aliases.join(' ').toLowerCase(), body = (t.def + ' ' + t.example).toLowerCase();
            let s = 0;
            for (const w of words) {
                if (name.includes(w)) s += 10; else if (alias.includes(w)) s += 7; else if (body.includes(w)) s += 2; else return 0;
            }
            if (name.startsWith(words.join(' '))) s += 20;
            return s;
        }
        const hl = (text, words) => {
            let out = esc(text);
            for (const w of words) if (w.length > 1) out = out.replace(new RegExp(`(${w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi'), '<mark>$1</mark>');
            return out;
        };

        function render() {
            const words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
            let rows = TERMS.map((t) => ({ t, s: score(t, words) })).filter((r) => r.s > 0
                && (state.cat === 'All' || r.t.cat === state.cat)
                && (!state.level || r.t.level === state.level)
                && (!state.saved || saved.has(r.t.id)));
            if (words.length) rows.sort((a, b) => b.s - a.s);
            $('g-count').textContent = `${rows.length} term${rows.length === 1 ? '' : 's'}${state.cat !== 'All' ? ' in ' + state.cat : ''}`;
            $('g-empty').classList.toggle('hidden', rows.length > 0);
            $('g-empty-q').textContent = state.q;
            $('g-saved-count').textContent = saved.size ? `(${saved.size})` : '';

            // Unfiltered view shows 24 at a time so the page stays short; any search/filter shows all matches.
            const filtered = words.length || state.cat !== 'All' || state.level || state.saved;
            const total = rows.length;
            if (!filtered) rows = rows.slice(0, state.limit);
            $('g-more').classList.toggle('hidden', !!filtered || total <= rows.length);
            $('g-more').textContent = `Show more terms (${total - rows.length} left)`;

            let lastLetter = '';
            $('g-list').innerHTML = rows.map(({ t }) => {
                const letter = t.term[0].toUpperCase();
                const anchor = !words.length && letter !== lastLetter ? ` data-letter="${letter}"` : '';
                lastLetter = letter;
                const open = state.open.has(t.id) || words.length > 0;
                const [lvl, cls] = LEVEL[t.level];
                const related = t.related.filter((r) => byName.has(r.toLowerCase()));
                return `
                <article id="${t.id}"${anchor} class="card p-5 scroll-mt-48 ${location.hash === '#' + t.id ? 'ring-2 ring-gold' : ''}">
                    <div class="flex items-start justify-between gap-3">
                        <div>
                            <h2 class="font-semibold text-lg text-white">${hl(t.term, words)}</h2>
                            <div class="mt-1 flex flex-wrap gap-1.5"><span class="badge ${cls}">${lvl}</span><span class="badge bg-white/10 text-gray-300">${esc(t.cat)}</span></div>
                        </div>
                        <div class="flex gap-1 shrink-0">
                            <button class="w-9 h-9 rounded-lg hover:bg-white/10 ${saved.has(t.id) ? 'text-gold' : 'text-gray-500'}" data-save="${t.id}" aria-label="${saved.has(t.id) ? 'Remove from' : 'Add to'} saved terms" aria-pressed="${saved.has(t.id)}">★</button>
                            <button class="w-9 h-9 rounded-lg hover:bg-white/10 text-gray-500" data-share="${t.id}" aria-label="Copy link to ${esc(t.term)}">🔗</button>
                        </div>
                    </div>
                    <p class="mt-3 text-gray-300 leading-relaxed ${open ? '' : 'line-clamp-3'}">${hl(t.def, words)}</p>
                    <div class="${open ? '' : 'hidden'}" data-more>
                        <div class="mt-3 rounded-xl bg-gold/5 border border-gold/20 p-3 text-sm text-gray-200"><span class="text-gold font-semibold">🇿🇦 Example: </span>${hl(t.example, words)}</div>
                        ${related.length ? `<p class="mt-3 text-sm text-gray-400">Related: ${related.map((r) => `<a href="#${slug(r)}" class="text-gold hover:underline" data-jump="${slug(r)}">${esc(r)}</a>`).join(', ')}</p>` : ''}
                    </div>
                    ${open ? '' : `<button class="mt-3 text-sm text-gold hover:underline" data-expand="${t.id}">Read more & example →</button>`}
                </article>`;
            }).join('');

            const letters = new Set((filtered ? rows.map(({ t }) => t) : TERMS).map((t) => t.term[0].toUpperCase()));
            $('g-az').innerHTML = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map((l) => letters.has(l) && !words.length
                ? `<a href="#" data-az="${l}" class="w-7 h-7 shrink-0 grid place-items-center rounded-md hover:bg-gold hover:text-black text-gray-300">${l}</a>`
                : `<span class="w-7 h-7 shrink-0 grid place-items-center text-gray-700">${l}</span>`).join('');
        }

        $('g-more').addEventListener('click', () => { state.limit += 24; render(); });
        $('g-search').addEventListener('input', (e) => { state.q = e.target.value; render(); });
        $('g-level').addEventListener('change', (e) => { state.level = +e.target.value; render(); });
        $('g-saved').addEventListener('click', (e) => {
            state.saved = !state.saved; e.currentTarget.setAttribute('aria-pressed', state.saved); render();
            if (state.saved && !saved.size) toast('Tap ★ on any term to save it here.');
        });
        $('g-cats').addEventListener('click', (e) => {
            const b = e.target.closest('[data-cat]'); if (!b) return;
            state.cat = b.dataset.cat;
            document.querySelectorAll('#g-cats .chip').forEach((x) => x.setAttribute('aria-pressed', x === b));
            render();
        });
        $('g-az').addEventListener('click', (e) => {
            const a = e.target.closest('[data-az]'); if (!a) return;
            e.preventDefault();
            if (!document.querySelector(`[data-letter="${a.dataset.az}"]`)) { state.limit = TERMS.length; render(); }
            document.querySelector(`[data-letter="${a.dataset.az}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        $('g-list').addEventListener('click', (e) => {
            const s = e.target.closest('[data-save]'), sh = e.target.closest('[data-share]'), ex = e.target.closest('[data-expand]'), j = e.target.closest('[data-jump]');
            if (s) { const id = s.dataset.save; saved.has(id) ? saved.delete(id) : saved.add(id); store.set('glossary-saved', [...saved]); render(); }
            if (sh) {
                const url = location.href.split('#')[0] + '#' + sh.dataset.share;
                (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => toast('Link copied'), () => toast(url));
            }
            if (ex) { state.open.add(ex.dataset.expand); render(); }
            if (j) { e.preventDefault(); openTerm(j.dataset.jump); }
        });

        function openTerm(id) {
            state.q = ''; state.cat = 'All'; state.level = 0; state.saved = false; state.limit = TERMS.length;
            $('g-search').value = ''; $('g-level').value = '0'; $('g-saved').setAttribute('aria-pressed', false);
            document.querySelectorAll('#g-cats .chip').forEach((x) => x.setAttribute('aria-pressed', x.dataset.cat === 'All'));
            state.open.add(id);
            history.replaceState(null, '', '#' + id);
            render();
            const el = document.getElementById(id);
            if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); el.classList.add('ring-2', 'ring-gold'); setTimeout(() => el.classList.remove('ring-2', 'ring-gold'), 2500); }
        }

        render();
        if (location.hash.length > 1) setTimeout(() => openTerm(location.hash.slice(1)), 50);
        const qp = new URLSearchParams(location.search).get('q');
        if (qp) { $('g-search').value = qp; state.q = qp; render(); }

        // ── Quiz ───────────────────────────────────────────────────────
        const quiz = { list: [], i: 0, score: 0 };
        const shuffle = (a) => a.map((v) => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map((p) => p[1]);
        function startQuiz() {
            const pool = state.saved && saved.size >= 4 ? TERMS.filter((t) => saved.has(t.id)) : TERMS.filter((t) => !state.level || t.level === state.level);
            quiz.list = shuffle(pool).slice(0, 10); quiz.i = 0; quiz.score = 0;
            $('quiz').classList.remove('hidden'); $('quiz').classList.add('flex');
            ask();
        }
        function ask() {
            const t = quiz.list[quiz.i];
            $('quiz-progress').textContent = `${quiz.i + 1} / ${quiz.list.length}`;
            $('quiz-score').textContent = `Score: ${quiz.score}`;
            $('quiz-def').textContent = t.def.replace(new RegExp(t.term.split(' (')[0].replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), '_____');
            const wrong = shuffle(TERMS.filter((x) => x.id !== t.id && x.cat === t.cat)).concat(shuffle(TERMS.filter((x) => x.id !== t.id))).filter((v, i, a) => a.indexOf(v) === i).slice(0, 3);
            $('quiz-options').innerHTML = shuffle([t, ...wrong]).map((o) => `<button class="text-left card px-4 py-3 hover:border-gold/50" data-ans="${o.id}">${esc(o.term)}</button>`).join('');
            $('quiz-next').classList.add('hidden');
        }
        $('quiz-options').addEventListener('click', (e) => {
            const b = e.target.closest('[data-ans]'); if (!b || $('quiz-options').dataset.locked === '1') return;
            const right = quiz.list[quiz.i].id;
            $('quiz-options').dataset.locked = '1';
            document.querySelectorAll('[data-ans]').forEach((x) => {
                if (x.dataset.ans === right) x.classList.add('!border-emerald-400', 'bg-emerald-500/10');
                else if (x === b) x.classList.add('!border-rose-400', 'bg-rose-500/10');
            });
            if (b.dataset.ans === right) quiz.score++;
            $('quiz-score').textContent = `Score: ${quiz.score}`;
            $('quiz-next').textContent = quiz.i + 1 < quiz.list.length ? 'Next →' : 'See result';
            $('quiz-next').classList.remove('hidden');
        });
        $('quiz-next').addEventListener('click', () => {
            $('quiz-options').dataset.locked = '0';
            if (++quiz.i < quiz.list.length) return ask();
            const pct = Math.round((quiz.score / quiz.list.length) * 100);
            $('quiz-def').innerHTML = `<span class="text-4xl block mb-2">${pct >= 80 ? '🏆' : pct >= 50 ? '👍' : '📚'}</span>You scored <strong class="text-gold">${quiz.score}/${quiz.list.length}</strong>. ${pct >= 80 ? 'Excellent! You know your money language.' : pct >= 50 ? 'Good going. Review the terms you missed and try again.' : 'Keep learning: save tricky terms with ★ and quiz yourself on them.'}`;
            $('quiz-options').innerHTML = `<button class="btn-gold" id="quiz-again">Play again</button>`;
            $('quiz-next').classList.add('hidden');
            store.set('quiz-best', Math.max(store.get('quiz-best', 0), pct));
        });
        $('quiz-options').addEventListener('click', (e) => { if (e.target.id === 'quiz-again') startQuiz(); });
        const closeQuiz = () => { $('quiz').classList.add('hidden'); $('quiz').classList.remove('flex'); };
        $('quiz-open').addEventListener('click', startQuiz);
        $('quiz-close').addEventListener('click', closeQuiz);
        $('quiz').addEventListener('click', (e) => { if (e.target.id === 'quiz') closeQuiz(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeQuiz(); });
    })();
    </script>
</body>
</html>
