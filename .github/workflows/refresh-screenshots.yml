name: Refresh library screenshots

on:
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC (06:00 SAST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-screenshots
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install script dependencies
        working-directory: scripts
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Retake screenshots
        working-directory: scripts
        run: node refresh-screenshots.mjs

      - name: Commit changes
        run: |
          git add src/img/library
          if git diff --cached --quiet; then
            echo "No screenshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh learning library screenshots"
          git push
